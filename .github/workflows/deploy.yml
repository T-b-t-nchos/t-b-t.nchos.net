name: Deploy static content to Pages

on:
  push:

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  cf-pages:
    environment:
      name: cloudflare-pages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build
        run: npm run build

      - name: Deploy Production
        if: github.ref == 'refs/heads/master'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=t-b-t-nchos --branch=master

      - name: Deploy Preview
        if: github.ref != 'refs/heads/master'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=t-b-t-nchos --branch=${{ github.ref_name }}
